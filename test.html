<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="顺北广播电视总台，提供高质量的在线直播服务。">
  <meta name="keywords" content="顺北广播电视, 在线直播, 高清视频">
  <title>顺北广播电视总台</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/mdui/1.0.2/css/mdui.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      z-index: 1000; /* 确保顶栏始终在最上方 */
      position: fixed;
      width: 100%;
      top: 0;
      left: 0;
      background: #fff; /* 确保顶栏背景颜色 */
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px; /* 给主内容区域添加边距 */
      padding-top: 56px; /* 顶栏高度 */
      box-sizing: border-box;
    }
    #mse {
      flex: 1;
      position: relative;
      z-index: 1;
      height: 70vh; /* 播放器高度占屏幕的70% */
    }
    .discussion-container {
      flex: 1;
      overflow-y: auto; /* 允许讨论区滚动 */
      margin: 0 20%; /* 左右边距 */
    }

    /* 桌面版布局 */
    @media (min-width: 768px) {
      main {
        flex-direction: column; /* 垂直布局 */
      }
      #mse {
        height: 70vh; /* 播放器高度占屏幕的70% */
      }
      .discussion-container {
        height: 30vh; /* 讨论区高度占屏幕的30% */
      }
    }

    /* 移动版布局 */
    @media (max-width: 767px) {
      main {
        padding: 10px; /* 小屏幕设备上的边距 */
        padding-top: 56px; /* 顶栏高度 */
      }
      #mse {
        height: 60vh; /* 小屏幕设备上播放器高度占屏幕的60% */
      }
      .discussion-container {
        height: 40vh; /* 小屏幕设备上讨论区高度占屏幕的40% */
        margin: 0 10%; /* 小屏幕设备上的左右边距 */
      }
    }
  </style>
</head>
<body>
  <header class="mdui-appbar mdui-appbar-fixed">
    <div class="mdui-toolbar mdui-color-theme">
      <a href="/" class="mdui-btn mdui-btn-icon" aria-label="首页">
        <i class="mdui-icon material-icons">live_tv</i>
      </a>
      <span class="mdui-typo-title">顺北广播电视总台 <mdui-badge variant="large">Beta</mdui-badge></span>
      <div class="mdui-toolbar-spacer"></div>
      <a href="https://chenbx.eu.org" class="mdui-btn mdui-btn-icon" aria-label="官方网站">
        <i class="mdui-icon material-icons">home</i>
      </a>
    </div>
  </header>
  <main>
    <div id="mse"></div>
    <div class="discussion-container">
      <div id="giscus-container"></div>
      <script src="https://giscus.app/client.js"
        data-repo="chenbx233/Public"
        data-repo-id="MDEwOlJlcG9zaXRvcnkzMDMxMTA5OTg="
        data-category="Announcements"
        data-category-id="DIC_kwDOEhEbVs4CcaJO"
        data-mapping="url"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="zh-CN"
        crossorigin="anonymous"
        async>
      </script>
    </div>
  </main>
  <script src="https://lf26-cdn-tos.bytecdntp.com/cdn/expire-1-M/mdui/1.0.2/js/mdui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dplayer@latest/dist/DPlayer.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/dplayer@latest/dist/DPlayer.min.css">
  <script>
    try {
      const dp = new DPlayer({
        container: document.getElementById('mse'),
        video: {
          url: 'http://stream.chenbx.eu.org/live/livestream.m3u8',
          type: 'hls'
        },
        live: true,
        autoplay: false, // 修改为false以禁用自动播放
        theme: '#FADFA3',
        loop: false,
        screenshot: false,
        hotkey: true,
        preload: 'metadata',
        volume: 0.7,
        mutex: true,
        lang: 'zh-cn',
        airplay: true,
        logo: '',
        fluid: false,
        customType: {
          hls: function(video, player) {
            const hls = new Hls();
            hls.loadSource(video.src);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
              video.play();
            });
          }
        }
      });

      // 确保播放器在点击播放按钮时不全屏
      document.getElementById('mse').addEventListener('click', function() {
        if (dp.video.requestFullscreen) {
          dp.video.requestFullscreen();
        } else if (dp.video.webkitRequestFullscreen) {
          dp.video.webkitRequestFullscreen();
        } else if (dp.video.msRequestFullscreen) {
          dp.video.msRequestFullscreen();
        }
      });
    } catch (error) {
      console.error("Failed to initialize the player:", error);
    }
  </script>
</body>
</html>
